<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="adBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#e5a93b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#b8860b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#adBg)" />
  <circle cx="640" cy="340" r="300" fill="url(#goldGlow)" />

  <!-- Luxury Watch / Chronograph Silhouette -->
  <circle cx="640" cy="340" r="140" fill="none" stroke="#e5a93b" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="640" cy="340" r="155" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  <circle cx="640" cy="340" r="120" fill="#0d0e14" />
  <!-- Watch Hands -->
  <line x1="640" y1="340" x2="640" y2="250" stroke="#e5a93b" stroke-width="4" stroke-linecap="round" />
  <line x1="640" y1="340" x2="700" y2="380" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="640" cy="340" r="6" fill="#e5a93b" />

  <!-- Top Badges -->
  <rect x="60" y="45" width="150" height="32" rx="16" fill="#e5a93b" fill-opacity="0.15" stroke="#e5a93b" stroke-opacity="0.6" stroke-width="1"/>
  <text x="135" y="66" fill="#e5a93b" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">COMMERCIAL / AD</text>
  <text x="1220" y="66" fill="#8e95aa" font-family="'Courier New', monospace" font-size="14" text-anchor="end">00:45 · 4K MACRO</text>

  <!-- Title & Copy -->
  <text x="640" y="550" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="12" text-anchor="middle">CHRONO NOIR</text>
  <text x="640" y="590" fill="#e5a93b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="6" text-anchor="middle">GLOBAL PRODUCT LAUNCH CAMPAIGN</text>
  <text x="640" y="620" fill="#8e95aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">SOUND DESIGN · LUXURY COLOR GRADING · PACING</text>
</svg>
