<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="mgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#190d30" />
      <stop offset="100%" stop-color="#06030c" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b829ff" />
      <stop offset="100%" stop-color="#2bd980" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#mgBg)" />

  <!-- 3D Isometric Wireframe Cube & Kinetic Geometry -->
  <g stroke="url(#polyGrad)" stroke-width="2" fill="none" opacity="0.8">
    <polygon points="640,160 820,260 820,460 640,360" fill="#1b1236" fill-opacity="0.6"/>
    <polygon points="640,160 460,260 460,460 640,360" fill="#140b29" fill-opacity="0.6"/>
    <polygon points="640,160 820,260 640,360 460,260" fill="#25164a" fill-opacity="0.6"/>
    
    <!-- Outer orbiting rings -->
    <ellipse cx="640" cy="320" rx="340" ry="120" stroke="#b829ff" stroke-width="1.5" stroke-dasharray="10 10" />
    <ellipse cx="640" cy="320" rx="420" ry="160" stroke="#2bd980" stroke-width="1.5" stroke-dasharray="20 10" />
  </g>

  <!-- Top Badges -->
  <rect x="60" y="45" width="170" height="32" rx="16" fill="#b829ff" fill-opacity="0.15" stroke="#b829ff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="145" y="66" fill="#b829ff" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">MOTION GRAPHICS</text>
  <text x="1220" y="66" fill="#8e95aa" font-family="'Courier New', monospace" font-size="14" text-anchor="end">AFTER EFFECTS · 3D</text>

  <!-- Title & Copy -->
  <text x="640" y="560" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="12" text-anchor="middle">NEXUS // 2026</text>
  <text x="640" y="598" fill="#b829ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="6" text-anchor="middle">FUTURISTIC TITLE SEQUENCE &amp; IDENTS</text>
  <text x="640" y="626" fill="#8e95aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">KINETIC TYPE · 3D CAMERA TRACKING · SOUND DESIGN</text>
</svg>
