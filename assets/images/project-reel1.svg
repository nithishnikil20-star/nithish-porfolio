<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="reelBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514" />
      <stop offset="50%" stop-color="#190d2e" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>
    <radialGradient id="neonPink" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="neonCyan" cx="70%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#reelBg1)" />
  <circle cx="360" cy="560" r="320" fill="url(#neonPink)" />
  <circle cx="500" cy="800" r="280" fill="url(#neonCyan)" />
  
  <!-- Modern Geometric Motion Lines -->
  <line x1="0" y1="200" x2="720" y2="340" stroke="#ff007f" stroke-width="2" stroke-opacity="0.4" />
  <line x1="0" y1="440" x2="720" y2="580" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 6" />
  <line x1="0" y1="880" x2="720" y2="1020" stroke="#ff007f" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Reel Aspect Badge -->
  <rect x="40" y="50" width="110" height="34" rx="17" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-opacity="0.6" stroke-width="1"/>
  <text x="95" y="72" fill="#ff007f" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">9:16 REEL</text>
  <text x="680" y="72" fill="#8e95aa" font-family="'Courier New', monospace" font-size="13" text-anchor="end">00:30 · 60 FPS</text>

  <!-- Soundwave waveform graphic -->
  <g fill="#ffffff" fill-opacity="0.3">
    <rect x="200" y="520" width="6" height="40" rx="3"/>
    <rect x="220" y="490" width="6" height="100" rx="3"/>
    <rect x="240" y="470" width="6" height="140" rx="3"/>
    <rect x="260" y="440" width="6" height="200" rx="3" fill="#00f2fe" fill-opacity="0.8"/>
    <rect x="280" y="420" width="6" height="240" rx="3" fill="#ff007f" fill-opacity="0.9"/>
    <rect x="300" y="450" width="6" height="180" rx="3"/>
    <rect x="320" y="480" width="6" height="120" rx="3"/>
    <rect x="340" y="430" width="6" height="220" rx="3" fill="#00f2fe"/>
    <rect x="360" y="410" width="6" height="260" rx="3" fill="#ff007f"/>
    <rect x="380" y="440" width="6" height="200" rx="3"/>
    <rect x="400" y="470" width="6" height="140" rx="3"/>
    <rect x="420" y="420" width="6" height="240" rx="3" fill="#00f2fe"/>
    <rect x="440" y="450" width="6" height="180" rx="3"/>
    <rect x="460" y="490" width="6" height="100" rx="3"/>
    <rect x="480" y="510" width="6" height="60" rx="3"/>
    <rect x="500" y="530" width="6" height="20" rx="3"/>
  </g>

  <!-- Title & Typography -->
  <text x="360" y="780" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="8" text-anchor="middle">URBAN RHYTHM</text>
  <text x="360" y="820" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="4" text-anchor="middle">FAST BEAT SYNC · STREET STYLE</text>
  <text x="360" y="860" fill="#8e95aa" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">1.2M+ ORGANIC VIEWS</text>

  <!-- Bottom Instagram/TikTok UI Hints -->
  <circle cx="650" cy="1120" r="22" fill="#ffffff" fill-opacity="0.1" />
  <circle cx="650" cy="1180" r="22" fill="#ffffff" fill-opacity="0.1" />
</svg>
