<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="reelBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0704" />
      <stop offset="50%" stop-color="#241106" />
      <stop offset="100%" stop-color="#080402" />
    </linearGradient>
    <radialGradient id="fireAmber" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ff3c00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#reelBg2)" />
  <circle cx="360" cy="580" r="350" fill="url(#fireAmber)" />

  <!-- Speed Motion Streaks -->
  <line x1="0" y1="420" x2="720" y2="390" stroke="#ffaa00" stroke-width="3" stroke-opacity="0.6" />
  <line x1="0" y1="460" x2="720" y2="430" stroke="#ff3c00" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="0" y1="510" x2="720" y2="480" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
  <line x1="0" y1="560" x2="720" y2="530" stroke="#ff7b00" stroke-width="2" stroke-opacity="0.5" />

  <!-- Reel Aspect Badge -->
  <rect x="40" y="50" width="110" height="34" rx="17" fill="#ff7b00" fill-opacity="0.2" stroke="#ff7b00" stroke-opacity="0.6" stroke-width="1"/>
  <text x="95" y="72" fill="#ff7b00" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">9:16 REEL</text>
  <text x="680" y="72" fill="#8e95aa" font-family="'Courier New', monospace" font-size="13" text-anchor="end">00:15 · 120 FPS</text>

  <!-- Speedometer / Tachometer Graphic -->
  <path d="M 240 680 A 130 130 0 1 1 480 680" fill="none" stroke="#333a4d" stroke-width="14" stroke-linecap="round" />
  <path d="M 240 680 A 130 130 0 0 1 460 580" fill="none" stroke="#ff7b00" stroke-width="14" stroke-linecap="round" />
  <circle cx="360" cy="620" r="12" fill="#ffffff" />
  <line x1="360" y1="620" x2="430" y2="540" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Typography -->
  <text x="360" y="800" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="8" text-anchor="middle">VELOCITY</text>
  <text x="360" y="840" fill="#ffaa00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="4" text-anchor="middle">SPEED RAMPS &amp; SOUND DESIGN</text>
  <text x="360" y="880" fill="#8e95aa" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">COMMERCIAL AUTO REEL</text>
</svg>
