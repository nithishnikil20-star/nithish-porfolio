  <text x="130" y="66" fill="#e5a93b" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">SHORT FILM</text>
  <text x="1220" y="66" fill="#8e95aa" font-family="'Courier New', monospace" font-size="14" text-anchor="end">22 MIN · NARRATIVE</text>

