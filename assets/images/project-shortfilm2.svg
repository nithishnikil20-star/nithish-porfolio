  <text x="640" y="310" fill="#e5a93b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="6" text-anchor="middle">OFFICIAL SELECTION · SUNDANCE LABS</text>
  <text x="640" y="620" fill="#8e95aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">DIRECTOR OF POST-PRODUCTION · NARRATIVE CONTINUITY · SOUNDSCAPE</text>
