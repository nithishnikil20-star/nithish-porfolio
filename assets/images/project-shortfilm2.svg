  </defs>
  <rect width="1280" height="720" fill="url(#film2Bg)" />
  <rect x="0" y="300" width="1280" height="200" fill="url(#horizonGrad)" />
  <line x1="0" y1="420" x2="1280" y2="420" stroke="#e5a93b" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Ocean wave silhouettes -->
  <path d="M 0 420 Q 320 400, 640 420 T 1280 420 L 1280 720 L 0 720 Z" fill="#061017" />
  <path d="M 0 480 Q 300 460, 600 480 T 1280 480 L 1280 720 L 0 720 Z" fill="#040a0f" />

  <!-- Top Badges -->
