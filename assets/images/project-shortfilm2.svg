      <stop offset="0%" stop-color="#070d12" />
      <stop offset="50%" stop-color="#10232c" />
      <stop offset="100%" stop-color="#04070a" />
    </linearGradient>
    <linearGradient id="horizonGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e5a93b" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#10232c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#04070a" stop-opacity="0.9"/>
