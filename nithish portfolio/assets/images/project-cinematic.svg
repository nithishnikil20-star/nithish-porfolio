<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="monolith" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#1e2942" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sciBg)" />
  <circle cx="640" cy="280" r="340" fill="url(#tealGlow)" />

  <!-- Monolith / Celestial Sci-Fi Edits -->
  <polygon points="560,520 600,140 680,140 720,520" fill="url(#monolith)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="640" y1="140" x2="640" y2="520" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />

  <!-- Celestial Rings -->
  <ellipse cx="640" cy="280" rx="420" ry="60" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
  <ellipse cx="640" cy="280" rx="360" ry="40" fill="none" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="12 6" />

  <!-- Top Badges -->
  <rect x="60" y="45" width="160" height="32" rx="16" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-opacity="0.6" stroke-width="1"/>
  <text x="140" y="66" fill="#00f2fe" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">CINEMATIC EDIT</text>
  <text x="1220" y="66" fill="#8e95aa" font-family="'Courier New', monospace" font-size="14" text-anchor="end">03:22 · 4K DCI ANAMORPHIC</text>

  <!-- Title & Copy -->
  <text x="640" y="585" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="14" text-anchor="middle">MONOLITH</text>
  <text x="640" y="620" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="6" text-anchor="middle">DIRECTOR'S TRAILER CUT</text>
  <text x="640" y="648" fill="#8e95aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">EPIC PACING · VFX COMPOSITING · ATMOSPHERIC SOUND</text>
</svg>
